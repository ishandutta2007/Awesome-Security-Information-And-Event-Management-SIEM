lvetica, Arial, sans-serif" font-size="16" font-weight="500">Security Information &amp; Event Management • Log Aggregation • Threat Analytics</text><g transform="translate(80, 180)"><rect width="165" height="32" x="0" y="0" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" rx="16"/><circle cx="16" cy="16" r="5" fill="#38bdf8"/><text x="30" y="21" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">SaaS &amp; Cloud SIEM</text><rect width="180" height="32" x="180" y="0" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="16"/><circle cx="196" cy="16" r="5" fill="#34d399"/><text x="210" y="21" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">Open-Source SIEM</text><rect width="185" height="32" x="375" y="0" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" rx="16"/><circle cx="391" cy="16" r="5" fill="#c084fc"/><text x="405" y="21" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">Detection &amp; UEBA</text><rect width="155" height="32" x="575" y="0" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="16"/><circle cx="591" cy="16" r="5" fill="#fbbf24"/><text x="605" y="21" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">XDR &amp; SOAR</text></g><text x="80" y="255" fill="#cbd5e1" font-family="sans-serif" font-size="13">🛡️ Curated benchmarks, verified pricing models, free trial limits &amp; star metrics for SOC defenders.</text><text x="80" y="280" fill="#64748b" font-family="sans-serif" font-size="12" font-style="italic">Updated for Security Operations &amp; Engineering Teams • October 2026</text></svg>