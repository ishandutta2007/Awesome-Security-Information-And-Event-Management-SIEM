<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Radar Pulse Effect -->
    <radialGradient id="radarPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Dynamic CSS Animations -->
    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.15); opacity: 0.8; }
      }
      @keyframes rotateRadar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes dashMove {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes neonGlow {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6)); }
        50% { filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.8)); }
      }
      .anim-radar { transform-origin: 1000px 180px; animation: rotateRadar 12s linear infinite; }
      .anim-pulse { transform-origin: 1000px 180px; animation: pulse 4s ease-in-out infinite; }
      .anim-dash { stroke-dasharray: 12, 12; animation: dashMove 10s linear infinite; }
      .anim-float { animation: floatParticle 5s ease-in-out infinite; }
      .anim-glow { animation: neonGlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="360" rx="16" fill="url(#cyberGrid)"/>

  <!-- Dynamic Radar Background Elements (Right Side Decorative Graphics) -->
  <g class="anim-pulse">
    <circle cx="1000" cy="180" r="140" fill="url(#radarPulse)"/>
    <circle cx="1000" cy="180" r="120" fill="none" stroke="#0284c7" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="1000" cy="180" r="80" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="1000" cy="180" r="40" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>

  <!-- Animated Radar Sweep Line -->
  <g class="anim-radar">
    <line x1="1000" y1="180" x2="1140" y2="180" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <polygon points="1000,180 1130,130 1140,180" fill="#38bdf8" fill-opacity="0.15"/>
  </g>

  <!-- Dynamic Security Analytics Connection Lines (Background) -->
  <path d="M 60 290 Q 300 320 550 290 T 1100 290" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" class="anim-dash"/>
  <path d="M 100 70 Q 400 40 700 80 T 1150 70" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.25" class="anim-dash"/>

  <!-- Left Side Floating Security Nodes (Background Visuals) -->
  <g class="anim-float">
    <circle cx="850" cy="90" r="4" fill="#38bdf8"/>
    <circle cx="920" cy="270" r="5" fill="#a855f7"/>
    <circle cx="1110" cy="120" r="3.5" fill="#4ade80"/>
    <line x1="850" y1="90" x2="920" y2="270" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.25"/>
  </g>

  <!-- Header Banner Container Box for Clean Foreground Text Layer -->
  <rect x="50" y="45" width="760" height="270" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Foreground Shield Icon -->
  <g class="anim-glow" transform="translate(80, 80)">
    <path d="M24 0 L48 10 V26 C48 42 24 54 24 54 C24 54 0 42 0 26 V10 Z" fill="url(#shieldGrad)" />
    <!-- Inner Shield Check / Analytics Symbol -->
    <path d="M16 26 L22 32 L34 18" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Foreground Title -->
  <text x="145" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" fill="url(#textGrad)" letter-spacing="0.5">
    Awesome SIEM Ecosystem
  </text>

  <!-- Subtitle -->
  <text x="145" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="16" fill="#94a3b8">
    Security Information &amp; Event Management • Log Aggregation • Threat Analytics
  </text>

  <!-- Pill Badges in Banner Foreground -->
  <g transform="translate(80, 180)">
    <!-- Pill 1: SaaS SIEM -->
    <rect x="0" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#38bdf8"/>
    <text x="30" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">SaaS &amp; Cloud SIEM</text>

    <!-- Pill 2: Open Source -->
    <rect x="180" y="0" width="180" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="196" cy="16" r="5" fill="#34d399"/>
    <text x="210" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Open-Source SIEM</text>

    <!-- Pill 3: Threat Detection -->
    <rect x="375" y="0" width="185" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="391" cy="16" r="5" fill="#c084fc"/>
    <text x="405" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Detection &amp; UEBA</text>

    <!-- Pill 4: XDR & SOAR -->
    <rect x="575" y="0" width="155" height="32" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="591" cy="16" r="5" fill="#fbbf24"/>
    <text x="605" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">XDR &amp; SOAR</text>
  </g>

  <!-- Banner Footer Description Line -->
  <text x="80" y="255" font-family="sans-serif" font-size="13" fill="#cbd5e1">
    🛡️ Curated benchmarks, verified pricing models, free trial limits &amp; star metrics for SOC defenders.
  </text>
  <text x="80" y="280" font-family="sans-serif" font-size="12" fill="#64748b" font-style="italic">
    Updated for Security Operations &amp; Engineering Teams • October 2026
  </text>
</svg>
