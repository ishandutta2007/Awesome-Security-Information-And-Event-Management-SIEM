<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#070a12"/></linearGradient><linearGradient id="cyanGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".8"/></linearGradient><linearGradient id="shieldGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient><radialGradient id="radarPulse" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".3"/><stop offset="70%" stop-color="#06b6d4" stop-opacity=".05"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulse{0%{transform:scale(1);opacity:.4}50%{transform:scale(1.15);opacity:.8}}@keyframes floatParticle{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes neonGlow{0%{filter:drop-shadow(0 0 8px rgba(56,189,248,.6))}50%{filter:drop-shadow(0 0 18px rgba(168,85,247,.8))}}.anim-pulse,.anim-radar{transform-origin:1000px 180px}.anim-radar{animation:rotateRadar 12s linear infinite}.anim-pulse{animation:pulse 4s ease-in-out infinite}.anim-dash{stroke-dasharray:12,12;animation:dashMove 10s linear infinite}.anim-float{animation:floatParticle 5s ease-in-out infinite}.anim-glow{animation:neonGlow 4s ease-in-out infinite}</style></defs><rect width="1200" height=